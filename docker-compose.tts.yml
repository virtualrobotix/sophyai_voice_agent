services:
  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    container_name: voice-agent-tts-dedicated
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      - DEFAULT_TTS=${DEFAULT_TTS:-edge}
      - TTS_PORT=8092
      - TTS_DEVICE=${TTS_DEVICE:-cuda}
      - HF_HOME=/app/models
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    volumes:
      - tts_models:/app/models
      - ./.cursor:/app/.cursor
      - ./tts_server.py:/app/tts_server.py:ro
      - ./agent/tts:/app/agent/tts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  tts_models:
