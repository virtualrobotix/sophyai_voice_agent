# LiveKit SIP Configuration
# Configurazione per il bridge SIP-WebRTC

# Configurazione Redis (richiesto per LiveKit SIP)
redis:
  address: 127.0.0.1:6379

# Configurazione LiveKit API
api_key: devkey
api_secret: secret_dev_key_change_in_production
ws_url: ws://127.0.0.1:7880

# Porta SIP signaling
sip_port: 5060

# Range porte RTP per il media
rtp_port:
  start: 10000
  end: 20000

# NAT 1:1 - IP pubblico (dopo NAT/firewall)
# Il server ha IP interno 159.223.228.197
# Ma è raggiungibile dall'esterno su 188.166.134.148 (NAT)
nat_1_to_1_ip: "188.166.134.148"
media_nat_1_to_1_ip: "188.166.134.148"

# Logging
logging:
  level: info
