services:
  # PostgreSQL per persistenza configurazioni e chat
  postgres:
    image: postgres:16-alpine
    container_name: voice-agent-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=voiceagent
      - POSTGRES_USER=voiceagent
      - POSTGRES_PASSWORD=voiceagent_pwd
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent -d voiceagent"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - voiceagent

  # Redis per LiveKit (locale)
  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - voiceagent

  # Whisper Server con GPU CUDA (solo per architetture NVIDIA)
  # Per Apple Silicon, usa whisper_server.py nativo in venv
  whisper:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    container_name: voice-agent-whisper
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      - WHISPER_MODEL=large-v3
      - WHISPER_LANGUAGE=it
      - WHISPER_DEVICE=cuda
      - WHISPER_PORT=8091
      - HF_HOME=/app/models
    volumes:
      - whisper_models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - voiceagent
    profiles:
      - nvidia

  # TTS Server con GPU CUDA (solo per architetture NVIDIA)
  # Per Apple Silicon, usa tts_server.py nativo in venv
  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    container_name: voice-agent-tts
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      - DEFAULT_TTS=edge
      - TTS_PORT=8092
      - TTS_DEVICE=cuda
      - HF_HOME=/app/models
    volumes:
      - tts_models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - voiceagent
    profiles:
      - nvidia

  # VibeVoice TTS Server - Container isolato con transformers compatibile
  # Richiede transformers 4.45.0 per evitare bug tensor size mismatch
  vibevoice:
    build:
      context: .
      dockerfile: Dockerfile.vibevoice
    container_name: voice-agent-vibevoice
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - HF_HOME=/app/models
    volumes:
      - vibevoice_models:/app/models
      - ./vibevoice_voices:/app/voices:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - voiceagent
    profiles:
      - nvidia

  # Web Server (Frontend + API) con HTTPS
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-agent-web
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      # Branding Configuration
      - APP_NAME=${APP_NAME:-Receptionist AI}
      - ASSISTANT_NAME=${ASSISTANT_NAME:-Receptionist}
      - ASSISTANT_TRIGGERS=${ASSISTANT_TRIGGERS:-@receptionist,receptionist,hey receptionist,ehi receptionist}
      # LiveKit Configuration
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://0.0.0.0:7880}
      - LIVEKIT_INTERNAL_URL=ws://host.docker.internal:7880
      - SERVER_IP=${SERVER_IP:-host.docker.internal}
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret_dev_key_change_in_production
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - DEFAULT_TTS=edge
      - WEB_PORT=8443
      - LOG_LEVEL=INFO
      - HF_HOME=/app/models/huggingface
      - DATABASE_URL=postgresql://voiceagent:voiceagent_pwd@postgres:5432/voiceagent
    volumes:
      - ./models:/app/models
      - ./certs:/app/certs:ro
      - ./config:/app/config
      - ./web:/app/web:ro
      - ./server.py:/app/server.py:ro
      - ./db:/app/db:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voiceagent
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # LiveKit SIP Bridge - per chiamate telefoniche
  # Usa network_mode: host per evitare problemi NAT con SIP/RTP
  sip:
    image: livekit/sip:latest
    container_name: livekit-sip
    restart: unless-stopped
    network_mode: host
    environment:
      - LIVEKIT_URL=ws://127.0.0.1:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret_dev_key_change_in_production
    volumes:
      - ./sip-config.yaml:/sip/config.yaml:ro

  # Voice Agent - si connette a LiveKit locale
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: voice-agent-worker
    restart: unless-stopped
    environment:
      # Branding Configuration
      - APP_NAME=${APP_NAME:-Receptionist AI}
      - ASSISTANT_NAME=${ASSISTANT_NAME:-Receptionist}
      - ASSISTANT_TRIGGERS=${ASSISTANT_TRIGGERS:-@receptionist,receptionist,hey receptionist,ehi receptionist}
      # LiveKit Configuration
      - LIVEKIT_URL=ws://host.docker.internal:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret_dev_key_change_in_production
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_LANGUAGE=it
      # Per NVIDIA: usa whisper e tts interni
      # Per Apple Silicon: usa server esterni (host.docker.internal)
      - WHISPER_SERVER_URL=${WHISPER_SERVER_URL:-http://host.docker.internal:8091}
      - TTS_SERVER_URL=${TTS_SERVER_URL:-http://host.docker.internal:8092}
      - DEFAULT_TTS=edge
      - LOG_LEVEL=INFO
      - HF_HOME=/app/models/huggingface
      - XDG_CACHE_HOME=/app/models/cache
      - DATABASE_URL=postgresql://voiceagent:voiceagent_pwd@postgres:5432/voiceagent
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./agent:/app/agent:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voiceagent
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  voiceagent:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  whisper_models:
  tts_models:
  vibevoice_models: